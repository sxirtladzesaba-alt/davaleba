<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მოტივაციური ციტატების გენერატორი</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6">

    <!-- სათაური -->
    <header class="text-center my-6">
        <h1
            class="text-3xl md:text-4xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">
            ✨ ყოველდღიური მოტივაცია
        </h1>
        <p class="text-slate-400 mt-2 text-sm md:text-base">მიიღე შთაგონება ერთი დაკლიკებით</p>
    </header>

    <!-- მთავარი კონტენტი / ციტატის ბარათი -->
    <main
        class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 shadow-2xl flex flex-col items-center text-center gap-6">
        <div id="quote-container" class="w-full flex flex-col gap-4">
            <p id="quote-text" class="text-xl md:text-2xl font-medium text-slate-200 italic">
                „იტვირთება ციტატა...“
            </p>
            <span id="quote-author" class="text-sm md:text-base text-cyan-400 font-semibold">
                — ავტორი
            </span>
        </div>

        <!-- მართვის ღილაკები -->
        <div class="flex flex-wrap justify-center gap-4 w-full mt-4">
            <button id="new-quote-btn"
                class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition-all shadow-lg cursor-pointer flex-1 min-w-[140px]">
                ახალი ციტატა 🔄
            </button>
            <button id="save-quote-btn"
                class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl transition-all shadow-lg cursor-pointer flex-1 min-w-[140px]">
                ფავორიტებში ⭐
            </button>
        </div>
    </main>

    <!-- შენახული ციტატების სექცია -->
    <section class="w-full max-w-xl mt-12 mb-6">
        <h2 class="text-xl font-bold text-slate-300 mb-4 border-b border-slate-700 pb-2">
            ⭐ შენახული ფავორიტები
        </h2>
        <div id="favorites-container" class="flex flex-col gap-3">
            <!-- აქ დაემატება შენახული ციტატები დინამიურად -->
            <p id="no-favorites" class="text-slate-500 text-sm italic">ჯერ ფავორიტები არ გაქვს.</p>
        </div>
    </section>

    <!-- ფუტერი -->
    <footer class="text-slate-500 text-xs text-center">
        შემუშავებულია AI-ის დახმარებით 🚀
    </footer>

    <!-- JavaScript ფაილის მიბმა -->
    <script src="script.js"></script>
</body>

</html>
