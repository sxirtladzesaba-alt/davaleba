<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>დავალება 1 – სურვილებისა და უნარების სია</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 md:p-8">

        <!-- Header -->
        <div class="text-center mb-6">
            <span
                class="inline-block bg-sky-500/10 text-sky-400 text-xs font-semibold px-3 py-1 rounded-full border border-sky-500/20 mb-2">
                TBC Tech School · დავალება 1
            </span>
            <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">🎯 ჩემი უნარების სია (Skill Tracker)</h1>
            <p class="text-slate-400 text-sm">დაამატე ახალი უნარები, დათვალე ისინი და წაშალე სურვილისამებრ!</p>
        </div>

        <!-- Stats & Counter -->
        <div class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-4 mb-6 flex items-center justify-between">
            <div>
                <p class="text-xs text-slate-400 uppercase font-semibold">სტატუსი</p>
                <p id="status-message" class="text-sm text-sky-400 font-medium">სია ჯერ ცარიელია</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-400 uppercase font-semibold">სულ უნარები</p>
                <p id="counter" class="text-2xl font-bold text-emerald-400">0</p>
            </div>
        </div>

        <!-- Input Form -->
        <div class="space-y-3 mb-6">
            <label for="skill-input" class="block text-xs font-medium text-slate-300">ახალი უნარი / ტექნოლოგია:</label>
            <div class="flex gap-2">
                <input id="skill-input" type="text" placeholder="მაგ: JavaScript ფუნქციები..."
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 transition" />
                <button id="add-btn"
                    class="bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-lg shadow-sky-600/30 flex items-center gap-1.5">
                    <span>➕</span> დამატება
                </button>
            </div>
            <p id="error-message" class="text-xs text-rose-400 hidden">⚠️ გთხოვთ, ჯერ შეიყვანოთ ტექსტი!</p>
        </div>

        <!-- Skills List Container -->
        <div class="mb-6">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-slate-300">დამატებული უნარები:</h2>
                <button id="clear-btn" class="text-xs text-rose-400 hover:text-rose-300 hover:underline transition">
                    🧹 ყველას გასუფთავება
                </button>
            </div>
            <ul id="skills-list" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                <!-- JS-ით აქ დაემატება ელემენტები -->
            </ul>
        </div>

        <!-- Footer Note -->
        <div class="border-t border-slate-700/60 pt-4 text-center">
            <p class="text-xs text-slate-500">
                💡 აპლიკაცია მზად არის გამოსაყენებლად!
            </p>
        </div>

    </div>

    <script>
        // 1. HTML ელემენტების წამოღება DOM-იდან
        const skillInput = document.getElementById("skill-input");
        const addBtn = document.getElementById("add-btn");
        const clearBtn = document.getElementById("clear-btn");
        const skillsList = document.getElementById("skills-list");
        const counterEl = document.getElementById("counter");
        const statusMessage = document.getElementById("status-message");
        const errorMessage = document.getElementById("error-message");

        // 2. მთვლელის ცვლადი
        let totalSkills = 0;

        // 3. UI-ის განახლების ფუნქცია
        function updateUI() {
            counterEl.textContent = totalSkills;

            if (totalSkills === 0) {
                statusMessage.textContent = "სია ჯერ ცარიელია";
                statusMessage.className = "text-sm text-sky-400 font-medium";
            } else {
                statusMessage.textContent = `თქვენ სწავლობთ ${totalSkills} უნარს! 🚀`;
                statusMessage.className = "text-sm text-emerald-400 font-medium";
            }
        }

        // 4. ახალი უნარის დამატების ფუნქცია
        function addSkill() {
            const text = skillInput.value.trim();

            if (text === "") {
                errorMessage.classList.remove("hidden");
                return;
            }

            errorMessage.classList.add("hidden");

            const li = document.createElement("li");
            li.className = "flex items-center justify-between bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 hover:border-sky-500/50 transition-all duration-200";

            li.innerHTML = `
        <span class="text-sm text-slate-200 font-medium flex items-center gap-2">
          <span class="text-sky-400">✨</span> ${text}
        </span>
        <button class="delete-btn text-slate-400 hover:text-rose-400 p-1 rounded-lg transition" title="წაშლა">
          🗑️
        </button>
      `;

            // წაშლის ლოგიკა
            const deleteBtn = li.querySelector(".delete-btn");
            deleteBtn.addEventListener("click", function () {
                li.remove();
                totalSkills--;
                updateUI();
            });

            skillsList.appendChild(li);
            totalSkills++;
            updateUI();

            skillInput.value = "";
            skillInput.focus();
        }

        // 5. მთელი სიის გასუფთავება
        function clearAll() {
            skillsList.innerHTML = "";
            totalSkills = 0;
            updateUI();
            errorMessage.classList.add("hidden");
        }

        // 6. Event Listeners
        addBtn.addEventListener("click", addSkill);

        skillInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addSkill();
            }
        });

        clearBtn.addEventListener("click", clearAll);

        // საწყისი ინიციალიზაცია
        updateUI();
    </script>
</body>

</html>
